<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc"><title id="title">Stay curious. Make something real.</title><desc id="desc">Animated footer with a glowing signal.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#0f766e"/><stop offset="1" stop-color="#020617"/></linearGradient></defs><rect width="1200" height="150" rx="18" fill="url(#g)"/><path d="M0 112 C230 45 370 150 600 84 S920 55 1200 102" fill="none" stroke="#a5f3fc" stroke-opacity=".65" stroke-width="2"><animate attributeName="stroke-dasharray" values="0 1500;400 1100;0 1500" dur="5s" repeatCount="indefinite"/></path><text x="600" y="70" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="25" font-weight="700">STAY CURIOUS. MAKE SOMETHING REAL.</text><text x="600" y="96" text-anchor="middle" fill="#a5f3fc" font-family="ui-monospace,monospace" font-size="12" letter-spacing="3">SEE YOU IN THE NEXT BUILD</text></svg>
