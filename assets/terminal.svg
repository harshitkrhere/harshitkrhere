<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Harshit OS build console</title>
  <desc id="desc">An animated terminal showing a product-building workflow.</desc>
  <defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <rect x="8" y="8" width="884" height="314" rx="16" fill="#020617" stroke="#164e63" stroke-width="2"/>
  <rect x="8" y="8" width="884" height="42" rx="16" fill="#0b2533"/>
  <circle cx="32" cy="29" r="6" fill="#fb7185"/><circle cx="54" cy="29" r="6" fill="#fbbf24"/><circle cx="76" cy="29" r="6" fill="#34d399"/>
  <text x="450" y="34" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="13">harshit.os — build console</text>
  <rect x="28" y="70" width="844" height="230" rx="10" fill="url(#panel)"/>
  <circle cx="450" cy="182" r="145" fill="#06b6d4" opacity=".06" filter="url(#soft)"><animate attributeName="r" values="125;155;125" dur="5s" repeatCount="indefinite"/></circle>
  <g font-family="ui-monospace, monospace" font-size="16">
    <text x="54" y="104" fill="#67e8f9">$ whoami</text><text x="195" y="104" fill="#e2e8f0">harshit / product builder</text>
    <text x="54" y="138" fill="#67e8f9">$ status</text><text x="195" y="138" fill="#a7f3d0">shipping in public</text>
    <text x="54" y="172" fill="#67e8f9">$ build --now</text><text x="215" y="172" fill="#f8fafc">MyBuddyMaid  December Code  SpireTrack</text>
    <text x="54" y="206" fill="#67e8f9">$ learn</text><text x="166" y="206" fill="#fcd34d">product systems  accounting  clarity</text>
    <text x="54" y="258" fill="#67e8f9">&gt;</text><text x="78" y="258" fill="#f8fafc">make something real</text><rect x="277" y="244" width="10" height="20" fill="#67e8f9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>
