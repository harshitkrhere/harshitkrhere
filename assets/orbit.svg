<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">What Harshit orbits</title><desc id="desc">Animated orbit showing product, community, open source, accounting, and strategy.</desc><defs><radialGradient id="core"><stop stop-color="#a5f3fc"/><stop offset="1" stop-color="#0891b2"/></radialGradient></defs><rect width="900" height="300" rx="18" fill="#020617"/><ellipse cx="450" cy="150" rx="300" ry="90" fill="none" stroke="#164e63" stroke-width="2"/><ellipse cx="450" cy="150" rx="180" ry="52" fill="none" stroke="#155e75" stroke-dasharray="5 9"/><g transform="rotate(0 450 150)"><circle cx="750" cy="150" r="7" fill="#67e8f9"/><animateTransform attributeName="transform" type="rotate" from="0 450 150" to="360 450 150" dur="14s" repeatCount="indefinite"/></g><g transform="rotate(180 450 150)"><circle cx="630" cy="150" r="6" fill="#a7f3d0"/><animateTransform attributeName="transform" type="rotate" from="180 450 150" to="540 450 150" dur="10s" repeatCount="indefinite"/></g><circle cx="450" cy="150" r="45" fill="url(#core)" opacity=".18"><animate attributeName="r" values="40;52;40" dur="4s" repeatCount="indefinite"/></circle><circle cx="450" cy="150" r="28" fill="url(#core)"/><text x="450" y="146" text-anchor="middle" fill="#ecfeff" font-family="ui-monospace,monospace" font-size="15" font-weight="700">HARSHIT</text><text x="450" y="166" text-anchor="middle" fill="#cffafe" font-family="ui-monospace,monospace" font-size="10">BUILD MODE</text><g fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="14"><text x="70" y="76">PRODUCT</text><text x="714" y="76">STRATEGY</text><text x="62" y="242">OPEN SOURCE</text><text x="715" y="242">COMMUNITY</text><text x="413" y="38">ACCOUNTING</text></g></svg>
