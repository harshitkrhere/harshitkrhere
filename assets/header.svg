<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Harshit Kumar - I build things that should exist</title>
  <desc id="desc">A dark teal animated header with a glowing grid and flowing signal line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#67e8f9" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="1030" cy="65" r="130" fill="#06b6d4" opacity=".12">
    <animate attributeName="r" values="118;145;118" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".08;.18;.08" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="205" r="90" fill="#14b8a6" opacity=".1">
    <animate attributeName="r" values="80;105;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <path d="M0 202 C180 156 280 232 460 190 S760 150 920 190 S1080 232 1200 170" fill="none" stroke="url(#signal)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 1500;420 1080;0 1500" dur="5s" repeatCount="indefinite"/>
  </path>
  <g fill="#a7f3d0">
    <circle cx="88" cy="74" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="155" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="46" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="104" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="42" font-weight="700" letter-spacing="3">HARSHIT KUMAR</text>
  <text x="600" y="145" text-anchor="middle" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">I BUILD THINGS THAT SHOULD EXIST</text>
  <text x="600" y="232" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">PRODUCTS  /  COMMUNITIES  /  OPEN SOURCE  /  GOOD IDEAS</text>
</svg>
